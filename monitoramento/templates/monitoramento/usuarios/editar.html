{% load static %}
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ titulo }} - SMC</title><link rel="stylesheet" href="{% static 'monitoramento/css/style.css' %}"><style>.edit-card{max-width:760px;margin:24px auto;background:#fff;padding:28px;border-radius:14px;box-shadow:0 8px 24px #0f172a12}.edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:7px}.field input,.field select{padding:11px;border:1px solid #cbd5e1;border-radius:8px;width:100%;box-sizing:border-box}.field small{color:#b91c1c}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.actions button,.actions a{padding:11px 16px;border:0;border-radius:8px;text-decoration:none;cursor:pointer}.save{background:#164e8a;color:white}.cancel{background:#e2e8f0;color:#183153}@media(max-width:600px){.edit-grid{grid-template-columns:1fr}}</style></head><body><main class="content"><p>SMC / Administração / Usuários</p><h1>{{ titulo }}</h1><section class="edit-card"><form method="post">{% csrf_token %}{% if form.non_field_errors %}<p style="color:#b91c1c">{{ form.non_field_errors }}</p>{% endif %}<div class="edit-grid">{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<small>{{ error }}</small>{% endfor %}</div>{% endfor %}</div><div class="actions"><a class="cancel" href="{% url 'lista_usuarios' %}">Cancelar</a><button class="save" type="submit">Salvar alterações</button></div></form></section></main></body></html>
