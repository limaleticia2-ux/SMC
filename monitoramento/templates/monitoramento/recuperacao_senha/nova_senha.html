{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Nova senha | SMC
    </title>

    <link
        rel="stylesheet"
        href="{% static 'monitoramento/css/style.css' %}"
    >

</head>

<body>

    <div class="layout">

        <main class="content">

            <h1>
                Criar nova senha
            </h1>

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit">
                    Alterar senha
                </button>

            </form>

        </main>

    </div>

</body>

</html>
